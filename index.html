<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>TCMEX</title>
<meta name="description" content="TCMEX">
<meta property="og:title" content="TCMEX">
<meta property="og:type" content="website">
<meta property="og:image" content="https://3loria12-art.github.io/TCMEX/images/tshirt-noir.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080808'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='900' text-anchor='middle' fill='%23c8ff00' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#121212;--lime:#c8ff00;--white:#f5f5f5;--gray:#a3a3a3;--line:#2a2a2a;--red:#ff7979;--green:#3ddc84;--orange:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--white);font-family:Archivo,Arial,Helvetica,sans-serif;line-height:1.5}
button,input,textarea,select{font:inherit}
button,a,select{cursor:pointer}
a{color:inherit;text-decoration:none}
button{border:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:#080808ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:900;letter-spacing:-2px}
.logo span{color:var(--lime)}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{font-size:13px;font-weight:700}
nav a:hover{color:var(--lime)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
select{background:#080808;color:var(--white);border:1px solid #444;padding:12px 8px;font-size:13px;font-weight:700}
button,.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;background:var(--lime);color:#080808;font-weight:900;font-size:13px;transition:transform .15s,background .15s}
button:hover,.btn:hover{background:#d8ff4d}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:wait}
.outline{background:transparent;color:var(--lime);border:1px solid var(--lime)}
.outline:hover{background:#c8ff0018}
.hero{min-height:72vh;padding:85px 8%;display:flex;align-items:center;background:radial-gradient(ellipse at 83% 50%,#293500,transparent 42%)}
.hero-content{max-width:760px}
.label{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:2px}
h1{font-size:clamp(50px,10vw,110px);line-height:.9;letter-spacing:-4px;margin:22px 0;font-weight:900}
h1 span{display:block;color:var(--lime)}
.hero p{max-width:440px;color:#bbb;line-height:1.8;margin:25px 0}
section{padding:70px 7%}
h2{font-size:clamp(32px,5vw,55px);letter-spacing:-2px;text-transform:uppercase;margin:12px 0 25px;font-weight:900;line-height:1}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px;gap:15px}
.section-head>span{color:var(--gray);font-size:13px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.product{border:1px solid var(--line);background:var(--card);min-width:0;transition:border-color .2s;cursor:pointer}
.product:hover{border-color:var(--lime)}
.art{height:260px;background:radial-gradient(circle,#2a2a2a,#101010 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-photo{width:100%;height:100%;object-fit:contain;display:block;padding:12px;transition:transform .3s}
.product:hover .product-photo{transform:scale(1.05)}
.product-info{padding:16px}
.product-info h3{font-size:14px;text-transform:uppercase}
.product-info p{color:var(--gray);font-size:13px;margin-top:6px}
.product-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.price{font-weight:700;color:var(--lime)}
.view{font-size:12px;color:var(--gray);text-decoration:underline}
.stock-tag{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-top:12px;color:var(--white)}
.stock-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.stock-tag.prep::before{background:var(--orange)}
.stock-tag.out::before{background:var(--red)}
.about{text-align:center;max-width:850px;margin:auto}
.about p{max-width:620px;margin:20px auto;color:var(--gray);line-height:1.9}
.faq{max-width:780px;margin:auto}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--lime);font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{color:var(--gray);margin-top:12px;font-size:14px;max-width:62ch}
.contact{text-align:center}
.contact p{color:var(--gray);margin:0 auto 22px;max-width:46ch}
.mailbox{display:flex;flex-direction:column;align-items:center;gap:14px}
.mailbox strong{font-size:20px;color:var(--lime);overflow-wrap:anywhere}
.mailbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
footer{border-top:1px solid var(--line);padding:30px 7%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;color:var(--gray);font-size:12px}
footer .links{display:flex;gap:18px;flex-wrap:wrap}
footer .links button{background:none;color:var(--gray);padding:0;font-weight:400;font-size:12px;text-decoration:underline}
footer .links button:hover{color:var(--lime)}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:15px}
.overlay.open{display:flex}
.modal{background:#111;border:1px solid #383838;width:min(500px,100%);max-height:90vh;overflow:auto;padding:25px;position:relative}
.modal h2{font-size:29px;margin:12px 0 20px}
.modal h3{font-size:14px;margin:18px 0 6px;color:var(--lime)}
.legal p{color:#ccc;font-size:13px;line-height:1.7}
.close{position:absolute;right:12px;top:10px;background:none;color:white;font-size:25px;padding:0 6px;z-index:2}
.close:hover{background:none;color:var(--lime)}
.pmodal{width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.pimg{background:radial-gradient(circle,#2a2a2a,#101010 70%);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.pimg img{width:100%;height:100%;object-fit:contain;padding:14px}
.pmodal h2{font-size:30px;margin:0 0 8px}
.pdesc{color:var(--gray);font-size:14px;margin-bottom:12px}
.pprice{font-size:22px;font-weight:900;color:var(--lime);margin-bottom:8px}
.pmodal .stock-tag{margin:0 0 20px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.size{background:transparent;color:var(--white);border:1px solid #444;padding:10px 12px;min-width:52px}
.size:hover{background:transparent;border-color:var(--lime)}
.size.active,.size.active:hover{background:var(--lime);color:#080808;border-color:var(--lime)}
.size:disabled,.size:disabled:hover{opacity:.35;cursor:not-allowed;border-color:#444}
#pAdd:disabled,#pAdd:disabled:hover{background:#2a2a2a;color:#999;opacity:1;cursor:not-allowed;transform:none}
.field{margin:14px 0}
.field label{display:block;color:#ccc;font-size:12px;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:12px;background:#080808;border:1px solid #444;color:white}
.field select{width:100%}
.full{width:100%}
.small-btn{display:block;background:none;color:var(--lime);padding:10px 0;text-decoration:underline;font-weight:700}
.small-btn:hover{background:none;color:#fff}
.notice,.status{font-size:13px;line-height:1.7;color:#ccc;margin:12px 0;overflow-wrap:anywhere}
.status{padding:12px;background:#1b1b1b;border-left:3px solid var(--lime)}
.hidden{display:none!important}
.cart-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #333;align-items:start}
.cart-row img{width:64px;height:64px;object-fit:contain;background:#1a1a1a}
.cart-row p{font-size:12px;color:var(--gray);margin-top:3px}
.quantity{display:flex;align-items:center;gap:10px;margin-top:8px}
.quantity button{background:#2a2a2a;color:white;padding:5px 11px}
.remove{background:none;color:var(--red);padding:8px 0;font-weight:400;font-size:12px}
.remove:hover{background:none;text-decoration:underline}
.total{display:flex;justify-content:space-between;padding:20px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--lime);color:#080808;padding:12px 18px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ====== Roue hebdomadaire ====== */
.wheel-widget{position:fixed;right:-160px;top:50%;margin-top:-160px;width:320px;z-index:9;transition:right .45s cubic-bezier(.2,.8,.2,1)}
.wheel-widget.open{right:18px}
.wheel-box{position:relative;width:320px;height:320px;cursor:pointer;border-radius:50%;box-shadow:0 0 40px #c8ff0040,0 10px 40px #000a}
.wheel-widget.ready:not(.open) .wheel-box{animation:wheelGlow 2.2s ease-in-out infinite}
@keyframes wheelGlow{0%,100%{box-shadow:0 0 22px #c8ff0040,0 10px 40px #000a}50%{box-shadow:0 0 55px #c8ff00aa,0 10px 40px #000a}}
.wheel-box canvas{display:block;width:320px;height:320px;border-radius:50%;transition:transform 5.5s cubic-bezier(.1,.7,.1,1)}
.wheel-pointer{position:absolute;left:-24px;top:50%;margin-top:-20px;width:0;height:0;border-top:20px solid transparent;border-bottom:20px solid transparent;border-right:38px solid #fff;z-index:2;filter:drop-shadow(0 2px 6px #000)}
.wheel-hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b2b2b,#050505);border:4px solid var(--lime);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;box-shadow:0 0 14px #000}
.wheel-tag{position:absolute;left:-4px;top:-40px;background:var(--lime);color:#080808;font-weight:900;font-size:12px;padding:7px 12px;white-space:nowrap}
.wheel-widget.open .wheel-tag{display:none}
.wheel-panel{display:none;margin-top:16px;background:#111;border:1px solid #383838;padding:16px;font-size:13px;color:#ccc;text-align:center}
.wheel-widget.open .wheel-panel{display:block}
.wheel-panel button{width:100%;margin-top:10px}
.wheel-panel .stars{font-size:22px;color:var(--orange);letter-spacing:4px;margin:6px 0}
.wheel-panel .stars i{font-style:normal;color:#444}
.wheel-panel .wheel-close{background:none;color:var(--gray);font-weight:400;font-size:12px;text-decoration:underline;padding:6px 0 0}
.wheel-panel .wheel-close:hover{background:none;color:var(--lime)}

@media(max-width:980px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){header{padding:12px 5%}.art{height:210px}.hero{padding:65px 6%}section{padding:50px 6%}.product-info{padding:12px}.pmodal{grid-template-columns:1fr;gap:16px;padding-top:40px}.pimg{aspect-ratio:4/3}
.wheel-widget{width:240px;right:-120px;margin-top:-120px}.wheel-widget.open{right:10px}.wheel-box,.wheel-box canvas{width:240px;height:240px}}
@media(max-width:430px){.products{grid-template-columns:1fr}.art{height:250px}nav{gap:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

let lang='fr';
try{const s=localStorage.getItem('tcmex_lang')||(navigator.language||'fr').slice(0,2);if(T[s])lang=s;}catch{}
const t=k=>T[lang][k]??T.fr[k]??k;

const $=id=>document.getElementById(id);
const money=n=>'CHF '+Number(n).toFixed(2);
let cart=[];
try{const saved=JSON.parse(localStorage.getItem('tcmex_cart')||'[]');if(Array.isArray(saved))cart=saved;}catch{}
let authMode='login',currentSession=null,recoveryMode=false,toastTimer;
let selected={id:null,size:null};

function safeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function message(id,text,error=false){const el=$(id);el.textContent=text;el.classList.remove('hidden');el.style.borderLeftColor=error?'var(--red)':'var(--lime)';}
function hideMessage(id){$(id).classList.add('hidden');}
function open(id){$(id).classList.add('open');document.body.style.overflow='hidden';}
function close(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow='';}
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

// Statut d'un produit : classe CSS (couleur du point) + clé de traduction
function stockInfo(status){
 if(status==='out')return {cls:'out',key:'st_out'};
 if(status==='prep')return {cls:'prep',key:'st_prep'};
 return {cls:'',key:'st_stock'};
}

// Image de remplacement si une photo ne charge pas
function placeholder(name){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#1a1a1a"/><text x="150" y="140" text-anchor="middle" font-family="Arial" font-weight="900" font-size="48" fill="#c8ff00">TCMEX</text><text x="150" y="180" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#f5f5f5">${safeText(name)}</text></svg>`;
 return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
document.addEventListener('error',e=>{const img=e.target;if(img&&img.tagName==='IMG'&&img.dataset.name&&!img.dataset.fb){img.dataset.fb='1';img.src=placeholder(img.dataset.name);}},true);

if(!TEST_MODE)document.querySelectorAll('.test-only').forEach(e=>e.remove());

// Contact : adresse affichée + bouton copier (rien ne s'ouvre tout seul)
$('mailText').textContent=CONTACT_EMAIL;
$('mailLink').href='mailto:'+CONTACT_EMAIL;
$('copyMail').onclick=async()=>{
 try{await navigator.clipboard.writeText(CONTACT_EMAIL);}
 catch{const i=document.createElement('input');i.value=CONTACT_EMAIL;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();}
 toast(t('copied'));
};

/* ====== Collection : cartes cliquables avec statut ====== */
function renderProducts(){
 $('products').innerHTML=products.map(p=>{
  const st=stockInfo(p.status);
  return `
 <article class="product" data-open="${p.id}" tabindex="0" role="button" aria-label="${safeText(p.name)} — ${safeText(t('view'))}">
 <div class="art"><img class="product-photo" src="${p.image}" data-name="${safeText(p.name)}" alt="${safeText(p.name)} — ${safeText(t(p.d))}" loading="lazy"></div>
 <div class="product-info"><h3>${safeText(p.name)}</h3><p>${safeText(t(p.d))}</p>
 <div class="product-bottom"><span class="price">${money(p.price)}</span><span class="view">${safeText(t('view'))}</span></div>
 <div class="stock-tag ${st.cls}">${safeText(t(st.key))}</div>
 </div></article>`;
 }).join('');
 document.querySelectorAll('[data-open]').forEach(c=>{
  c.onclick=()=>openProduct(c.dataset.open);
  c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProduct(c.dataset.open);}};
 });
}

/* ====== Fenêtre produit : choix de la taille ====== */
function openProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const out=p.status==='out';
 const st=stockInfo(p.status);
 selected={id,size:null};
 const img=$('pImg');img.dataset.name=p.name;img.removeAttribute('data-fb');img.src=p.image;img.alt=p.name;
 $('pName').textContent=p.name;
 $('pDesc').textContent=t(p.d);
 $('pPrice').textContent=money(p.price);
 $('pStock').className='stock-tag '+st.cls;
 $('pStock').textContent=t(st.key);
 $('pLabel').textContent='TCMEX';
 $('pSizeLabel').textContent=t(p.shoe?'size_label_shoe':'size_label');
 hideMessage('pMsg');
 $('pSizes').innerHTML=p.sizes.map(s=>`<button type="button" class="size" data-size="${s}" aria-pressed="false"${out?' disabled':''}>${s}</button>`).join('');
 document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{
  selected.size=b.dataset.size;hideMessage('pMsg');
  document.querySelectorAll('.size').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on);});
 });
 $('pAdd').disabled=out;
 $('pAdd').textContent=t(out?'add_unavail':'add_cart');
 open('productOverlay');
}
$('pAdd').onclick=()=>{
 const p=products.find(x=>x.id===selected.id);
 if(!p||p.status==='out')return;
 if(!selected.size){message('pMsg',t('pick_size'),true);return;}
 addToCart(selected.id,selected.size);
 close('productOverlay');
 toast(t('added'));
};

/* ====== Panier (une ligne par article + taille) ====== */
function saveCart(){try{localStorage.setItem('tcmex_cart',JSON.stringify(cart));}catch{}renderCart();}
function addToCart(id,size){
 const p=products.find(p=>p.id===id);if(!p||p.status==='out'||!p.sizes.includes(size))return;
 const line=cart.find(x=>x.id===id&&x.size===size);
 if(line)line.qty=Math.min(20,line.qty+1);else cart.push({id,size,qty:1});
 saveCart();
}
function changeQty(id,size,delta){
 const line=cart.find(x=>x.id===id&&x.size===size);if(!line)return;
 line.qty+=delta;
 if(line.qty<=0)cart=cart.filter(x=>!(x.id===id&&x.size===size));else line.qty=Math.min(20,line.qty);
 saveCart();
}
function renderCart(){
 // On retire du panier les articles inconnus, hors stock ou avec une taille invalide
 cart=cart.filter(x=>{const p=products.find(p=>p.id===x.id);return p&&p.status!=='out'&&p.sizes.includes(x.size)&&Number.isInteger(x.qty)&&x.qty>0;});
 $('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);
 $('checkoutStartButton').disabled=!cart.length;
 if(!cart.length)$('cartItems').innerHTML=`<p class="notice">${safeText(t('empty'))}</p>`;
 else{
 $('cartItems').innerHTML=cart.map(line=>{
  const p=products.find(x=>x.id===line.id);
  const d=`data-id="${p.id}" data-size="${line.size}"`;
  const sizeTxt=line.size+(p.shoe?'':' cm');
  return `<div class="cart-row"><img src="${p.image}" data-name="${safeText(p.name)}" alt=""><div><strong>${safeText(p.name)}</strong><p>${safeText(t(p.shoe?'size_cart_shoe':'size_cart'))}${safeText(sizeTxt)}</p><p>${money(p.price)} ${safeText(t('per_item'))}</p><div class="quantity"><button data-act="minus" ${d} type="button" aria-label="${safeText(t('minus'))}">−</button><span>${line.qty}</span><button data-act="plus" ${d} type="button" aria-label="${safeText(t('plus'))}">+</button></div><button class="remove" data-act="remove" ${d} type="button">${safeText(t('remove'))}</button></div><strong>${money(p.price*line.qty)}</strong></div>`;
 }).join('');
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
  const {id,size}=b.dataset;
  if(b.dataset.act==='minus')changeQty(id,size,-1);
  else if(b.dataset.act==='plus')changeQty(id,size,1);
  else{cart=cart.filter(x=>!(x.id===id&&x.size===size));saveCart();}
 });
 }
 $('cartTotal').textContent=money(cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0));
}

/* ====== Compte ====== */
function setAuthMode(mode){
 authMode=mode;recoveryMode=false;$('newPasswordForm').classList.add('hidden');$('authForm').classList.remove('hidden');hideMessage('authMessage');
 $('nameField').classList.toggle('hidden',mode!=='signup');$('passwordField').classList.toggle('hidden',mode==='reset');$('authPassword').required=mode!=='reset';$('authPassword').autocomplete=mode==='signup'?'new-password':'current-password';
 $('forgotButton').classList.toggle('hidden',mode!=='login');$('signupButton').classList.toggle('hidden',mode!=='login');$('loginButton').classList.toggle('hidden',mode==='login');
 $('authTitle').textContent=t(mode==='signup'?'t_signup':mode==='reset'?'t_reset':'t_login');
 $('authSubmit').textContent=t(mode==='signup'?'b_signup':mode==='reset'?'b_reset':'b_login');
}
function updateAccountUI(){
 const user=currentSession?.user;const logged=!!user;
 $('accountButton').textContent=t(logged?'account':'login');
 $('accountInfo').classList.toggle('hidden',!logged);$('logoutButton').classList.toggle('hidden',!logged);
 if(logged){$('accountInfo').textContent=t('connected_with')+(user.email||'');$('authTitle').textContent=t('account');$('authForm').classList.add('hidden');$('newPasswordForm').classList.add('hidden');$('forgotButton').classList.add('hidden');$('signupButton').classList.add('hidden');$('loginButton').classList.add('hidden');}
 else if(!recoveryMode){$('accountInfo').classList.add('hidden');setAuthMode(authMode);}
 // Roue : recharger l'état quand l'utilisateur connecté change
 const uid=user?.id||null;
 if(uid!==wheelUser){wheelUser=uid;loadWheel();}
}

 document.documentElement.lang=lang;
 document.title=t('title');
 document.querySelector('meta[name="description"]').content=t('meta');
 document.querySelector('meta[property="og:title"]').content=t('title');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ia)));

}

async function refreshSession(){
 const {data,error}=await supabase.auth.getSession();
 if(error)throw error;
 currentSession=data.session;updateAccountUI();
}
function handleReturnParams(){
 const params=new URLSearchParams(window.location.search);
 const clean=()=>window.history.replaceState({},document.title,window.location.pathname);
 if(params.get('confirmed')==='true'){
  clean();open('accountOverlay');
  message('authMessage',t(currentSession?'m_confirmed_in':'m_confirmed_out'));
 }else if(params.has('success')||params.get('checkout')==='success'||params.get('paid')==='true'){
  clean();cart=[];saveCart();toast(t('thanks'));
 }else if(params.has('canceled')||params.has('cancel')||params.get('checkout')==='cancel'){
  clean();toast(t('canceled'));
 }
}
$('accountButton').onclick=async()=>{try{await refreshSession();}catch(e){message('authMessage',e.message||t('e_generic'),true)}if(!currentSession?.user&&!recoveryMode)setAuthMode('login');open('accountOverlay');};
$('cartButton').onclick=()=>{renderCart();open('cartOverlay')};
$('forgotButton').onclick=()=>setAuthMode('reset');
$('signupButton').onclick=()=>setAuthMode('signup');
$('loginButton').onclick=()=>setAuthMode('login');

$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();const email=$('authEmail').value.trim(),password=$('authPassword').value,btn=$('authSubmit');btn.disabled=true;hideMessage('authMessage');
 try{
  if(authMode==='signup'){
   const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:CONFIRM_URL,data:{first_name:$('authName').value.trim()}}});
   if(error)throw error;
   if(data.session){currentSession=data.session;updateAccountUI();message('authMessage',t('m_created'));}
   else message('authMessage',t('m_sent'));

   const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;
   currentSession=data.session;updateAccountUI();message('authMessage',t('m_logged'));
  }else{
   const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});if(error)throw error;
   message('authMessage',t('m_reset'));
  }
 }catch(err){console.error(err);message('authMessage',err.message||t('e_generic'),true);}

 const {error}=await supabase.auth.signOut();
 if(error){message('authMessage',error.message,true);return;}
 currentSession=null;recoveryMode=false;setAuthMode('login');updateAccountUI();message('authMessage',t('m_out'));

 e.preventDefault();const btn=$('newPasswordForm').querySelector('button');btn.disabled=true;
 try{const {error}=await supabase.auth.updateUser({password:$('newPassword').value});if(error)throw error;
 recoveryMode=false;$('newPasswordForm').classList.add('hidden');setAuthMode('login');message('authMessage',t('m_pwchanged'));}
 catch(err){message('authMessage',err.message||t('e_generic'),true);}

 if(!cart.length){close('cartOverlay');return;}
 close('cartOverlay');
 try{await refreshSession();}catch{}
 if(!currentSession?.user){open('accountOverlay');setAuthMode('login');message('authMessage',t('m_need_login'));return;}
 hideMessage('checkoutMessage');$('buyerEmail').value=currentSession.user.email||'';
 if(currentSession.user.user_metadata?.first_name&&!$('buyerName').value)$('buyerName').value=currentSession.user.user_metadata.first_name;
 // Liste des récompenses disponibles (roue)
 await loadWheel();
 $('buyerReward').innerHTML=`<option value="">${safeText(t('w_no_reward'))}</option>`+wheelState.rewards.map(r=>`<option value="${safeText(r.id)}">${safeText(t('w_'+r.kind))}</option>`).join('');
 open('checkoutOverlay');

// Ouvre la page de paiement Stripe
$('checkoutForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!cart.length){message('checkoutMessage',t('m_empty'),true);return;}
 const btn=$('checkoutSubmit');btn.disabled=true;hideMessage('checkoutMessage');
 try{
  const {data,error}=await supabase.auth.getSession();
  if(error)throw error;
  const session=data.session;
  if(!session?.access_token)throw new Error(t('e_login'));
  message('checkoutMessage',t('m_prep'));
  const response=await fetch(`${SUPABASE_URL}/functions/v1/create-checkout`,{
   method:'POST',
   headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},
   body:JSON.stringify({
    items:cart.map(line=>({id:line.id,qty:line.qty,size:line.size})),
    buyer:{name:$('buyerName').value.trim(),email:$('buyerEmail').value.trim(),address:$('buyerAddress').value.trim()},
    reward_id:$('buyerReward').value||null,
    locale:lang
   })
  });
  const result=await response.json().catch(()=>({}));
  if(response.status===401)throw new Error(t('e_session'));
  if(response.status===404)throw new Error(t('e_notfound'));
  if(!response.ok)throw new Error(result.error||result.message||t('e_prep'));
  if(!result.url||!result.url.startsWith('https://checkout.stripe.com/'))throw new Error(t('e_stripe'));
  message('checkoutMessage',t('m_redirect'));
  window.location.href=result.url;
 }catch(err){console.error(err);message('checkoutMessage',err.message||t('e_generic'),true);btn.disabled=false;}
});

/* ====== Roue hebdomadaire ======
   Le tirage est fait côté serveur (fonction SQL spin_wheel sur Supabase).
   Les angles ci-dessous sont proportionnels aux probabilités, uniquement pour l'affichage. */
const WHEEL=[
 {k:'discount5', bg:['#2b2b2b','#101010'],fg:'#f5f5f5'},
 {k:'discount10',bg:['#dcff5a','#a3d100'],fg:'#080808'},
 {k:'discount15',bg:['#4f6710','#26330a'],fg:'#c8ff00'},
 {k:'star',      bg:['#ffd070','#e08d00'],fg:'#080808'},
 {k:'free_order',bg:['#ffffff','#cdcdcd'],fg:'#080808'}
];
let wheelState={can_spin:false,stars:0,rewards:[]},wheelRot=0,wheelBusy=false,wheelUser=null;
// 5 parts égales (72°) pour que les textes restent lisibles ; les vraies chances sont tirées côté serveur et affichées dans le panneau
WHEEL.forEach((s,i)=>{s.start=i*72;s.end=(i+1)*72;});

function drawWheel(){
 const c=$('wheelCanvas'),x=c.getContext('2d'),S=c.width,R=S/2,rad=d=>d*Math.PI/180;
 const rim=36,rIn=R-rim,hub=60;
 x.clearRect(0,0,S,S);
 // couronne extérieure
 const g=x.createRadialGradient(R,R,rIn,R,R,R);g.addColorStop(0,'#9fcc00');g.addColorStop(1,'#d8ff4d');
 x.beginPath();x.arc(R,R,R-2,0,Math.PI*2);x.fillStyle=g;x.fill();x.lineWidth=4;x.strokeStyle='#080808';x.stroke();
 // ampoules
 for(let i=0;i<24;i++){
  const a=rad(i*15),px=R+Math.cos(a)*(R-rim/2),py=R+Math.sin(a)*(R-rim/2);
  x.beginPath();x.arc(px,py,7,0,Math.PI*2);x.fillStyle=i%2?'#080808':'#ffffff';x.fill();
 }
 // parts + textes
 WHEEL.forEach(s=>{
  const g2=x.createRadialGradient(R,R,hub,R,R,rIn);g2.addColorStop(0,s.bg[0]);g2.addColorStop(1,s.bg[1]);
  x.beginPath();x.moveTo(R,R);x.arc(R,R,rIn,rad(s.start),rad(s.end));x.closePath();
  x.fillStyle=g2;x.fill();x.lineWidth=4;x.strokeStyle='#080808';x.stroke();
  const mid=rad((s.start+s.end)/2),lines=t('w_s_'+s.k).split('|');
  x.save();x.translate(R,R);x.rotate(mid+Math.PI); // texte lisible quand la part est au repère (à gauche)
  x.textAlign='center';x.textBaseline='middle';x.fillStyle=s.fg;
  const sizes=lines.map((_,i)=>i===0?64:25),gap=6;
  const total=sizes.reduce((a,b)=>a+b,0)+gap*(lines.length-1);
  let y=-total/2;
  lines.forEach((ln,i)=>{
   y+=sizes[i]/2;
   x.font=`900 ${sizes[i]}px Archivo,Arial,sans-serif`;
   x.fillText(ln,-(hub+rIn)/2,y);
   y+=sizes[i]/2+gap;
  });
  x.restore();
 });
}
function wheelLoggedIn(){return !!currentSession?.user;}
function renderWheelPanel(){
 const st=wheelState,btn=$('wheelSpin');
 $('wheelStars').innerHTML=Array.from({length:5},(_,i)=>i<st.stars?'★':'<i>★</i>').join('');
 let info=safeText(t('w_stars'))+st.stars+'/5';
 if(wheelLoggedIn()){
  info+='<br>'+(st.rewards.length?safeText(t('w_reward'))+st.rewards.map(r=>safeText(t('w_'+r.kind))).join(', '):safeText(t('w_none')));
  info+='<br><br>'+safeText(t(st.can_spin?'w_ready':'w_done'));
 }
 info+='<br><br><span style="color:#888;font-size:11px">'+safeText(t('w_odds'))+'</span>';$('wheelInfo').innerHTML=info;$('wheelWidget').classList.toggle('ready',wheelLoggedIn()?st.can_spin:true);
 if(!wheelLoggedIn()){btn.textContent=t('w_login');btn.disabled=false;}
 else{btn.textContent=t(wheelBusy?'w_spinning':'w_spin');btn.disabled=wheelBusy||!st.can_spin;}
}
async function loadWheel(){
 if(!wheelLoggedIn()){wheelState={can_spin:false,stars:0,rewards:[]};renderWheelPanel();return;}
 const {data,error}=await supabase.rpc('wheel_status');
 if(error){console.error(error);return;}
 wheelState=data;renderWheelPanel();
}
function spinTo(key){
 const s=WHEEL.find(w=>w.k===key);
 const a=s.start+(s.end-s.start)*(0.15+Math.random()*0.7); // point dans la part gagnante
 const want=((180-a)%360+360)%360;                          // le repère est à 9h (180°)
 const base=wheelRot-(wheelRot%360);
 wheelRot=base+360*6+want;
 $('wheelCanvas').style.transform=`rotate(${wheelRot}deg)`;
}
$('wheelBox').onclick=()=>{$('wheelWidget').classList.add('open');loadWheel();};
$('wheelClose').onclick=()=>$('wheelWidget').classList.remove('open');
$('wheelSpin').onclick=async()=>{
 if(!wheelLoggedIn()){open('accountOverlay');setAuthMode('login');message('authMessage',t('m_need_login'));return;}
 if(wheelBusy||!wheelState.can_spin)return;
 wheelBusy=true;renderWheelPanel();
 const {data,error}=await supabase.rpc('spin_wheel');
 if(error){
  wheelBusy=false;
  toast(t(String(error.message).includes('already_spun')?'w_already':'w_err'));
  await loadWheel();return;
 }
 spinTo(data.result);
 setTimeout(async()=>{
  wheelBusy=false;
  toast(t('w_won')+t('w_'+data.result));
  if(data.bonus_free_order)setTimeout(()=>toast(t('w_bonus')),2400);
  await loadWheel();
 },5700);
};
drawWheel();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawWheel);

async function initAuth(){
 try{await refreshSession();}catch(err){console.error('Supabase session:',err);}
 handleReturnParams();
 supabase.auth.onAuthStateChange((event,session)=>{
  currentSession=session;
  if(event==='PASSWORD_RECOVERY'){
   recoveryMode=true;open('accountOverlay');$('authTitle').textContent=t('t_newpw');
   $('authForm').classList.add('hidden');$('newPasswordForm').classList.remove('hidden');
   $('accountInfo').classList.add('hidden');$('logoutButton').classList.add('hidden');
   $('forgotButton').classList.add('hidden');$('signupButton').classList.add('hidden');$('loginButton').classList.add('hidden');
   hideMessage('authMessage');return;
  }
  if(!recoveryMode)updateAccountUI();
 });
}
applyLang();initAuth();
